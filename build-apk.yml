name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Restore stable signing key
        if: ${{ secrets.BORSAPATTERN_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.BORSAPATTERN_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/borsapattern-release.jks"

      - name: Build stable release APK
        if: ${{ secrets.BORSAPATTERN_KEYSTORE_BASE64 != '' }}
        env:
          BORSAPATTERN_KEYSTORE_PATH: ${{ runner.temp }}/borsapattern-release.jks
          BORSAPATTERN_KEYSTORE_PASSWORD: ${{ secrets.BORSAPATTERN_KEYSTORE_PASSWORD }}
          BORSAPATTERN_KEY_ALIAS: ${{ secrets.BORSAPATTERN_KEY_ALIAS }}
          BORSAPATTERN_KEY_PASSWORD: ${{ secrets.BORSAPATTERN_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Build debug APK fallback
        if: ${{ secrets.BORSAPATTERN_KEYSTORE_BASE64 == '' }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload stable release APK
        if: ${{ secrets.BORSAPATTERN_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: BorsaPattern-v08-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK fallback
        if: ${{ secrets.BORSAPATTERN_KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: BorsaPattern-v08-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
